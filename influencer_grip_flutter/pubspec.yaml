name: influencer_grip_flutter
description: A secure messaging app with AES encryption and SMS OTP verification

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  encrypt: ^5.0.1
  http: ^1.1.0
  sms_advanced: ^1.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^4.0.2
  permission_handler: ^11.0.1
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700